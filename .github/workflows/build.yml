name: Build Electron App

on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]
        include:
          - os: windows-latest
            build-script: electron:build:win
            artifact-name: win-package
            artifact-pattern: release/*.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron
        run: pnpm run ${{ matrix.build-script }}

      - name: Deploy to JD Cloud
        env:
          SSH_KEY: ${{ secrets.JD_CLOUD_SSH_KEY }}
          SSH_HOST: ${{ secrets.JD_CLOUD_HOST }}
          SSH_USER: ${{ secrets.JD_CLOUD_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "mkdir -p /var/www/updates"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key release/* $SSH_USER@$SSH_HOST:/var/www/updates/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-pattern }}
